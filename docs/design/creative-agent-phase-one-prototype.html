rt .scene-art { height:420px; margin:0; } .large-art .scene-art::after { width:85px; height:170px; } .large-art .scene-art .head { width:36px; height:44px; bottom:160px; left:calc(35% + 24px); } .large-art .scene-art .art-label { font-size:11px; padding:4px 8px; } .toast { position:fixed; z-index:100; bottom:25px; left:50%; transform:translateX(-50%); background:var(--yc-strong); color:var(--yc-on-strong); padding:11px 17px; border-radius:9px; font-size:12px; max-width:90%; box-shadow:var(--yc-shadow); }

<body>
  <div class="review-bar" aria-label="设计评审控制，与产品界面分开">
    <div class="review-label"><b>交互原型 · 示例数据</b><span>不会调用模型或扣费</span></div>
    <div class="review-nav"><label for="review-state">评审状态</label><select id="review-state" aria-label="跳转评审状态"><option value="home">从首页体验</option><option value="questions">需求问答</option><option value="proposal">方案待确认</option><option value="quote">画布与费用确认</option><option value="running">生成中</option><option value="complete">结果与局部调整</option><option value="failure">结果回写失败</option><option value="casual">普通聊天</option></select><button data-action="theme" aria-label="切换明暗主题">浅 / 深</button><button data-action="reset">重置</button></div>
  </div>
  <div id="app" class="app-shell"></div>
  <dialog id="detail-dialog" class="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script>
    (() => {
      'use strict';
      const root = document.getElementById('app');
      const dialog = document.getElementById('detail-dialog');
      const defaultPrompt = '帮我做一集 15 秒、9:16 的悬疑推理短片。雨夜，一位年轻侦探发现一封写着自己名字的信。';
      const questions = [
        {id:'hook',title:'故事的悬念，你更喜欢哪种方向？',hint:'已知是悬疑推理短片，只补充影响故事走向的选择。',options:[['时间循环','那封信来自未来的自己，结尾留下循环线索。'],['身份谜局','寄信人与侦探身份交错，制造一次认知反转。'],['无声追踪','门外脚步声逐渐逼近，用环境制造压迫感。']]},
        {id:'style',title:'画面希望呈现什么质感？',hint:'这会影响角色设定、镜头提示词和后续画面生成。',options:[['写实电影感','冷色雨夜、克制灯光、真实人物，突出悬疑氛围。'],['黑白侦探片','强烈明暗对比与胶片颗粒，经典黑色电影风格。'],['悬疑动画','风格化人物与场景，更适合系列化内容。']]},
        {id:'ending',title:'这 15 秒，你希望如何收尾？',hint:'可以选一个方向，也可以在下面直接写你的想法。',options:[['留一个钩子','门外出现与侦探完全相同的身影，故事戛然而止。'],['揭示一次反转','侦探打开信，发现每句话都在描述眼前的动作。'],['交给你决定','根据已有设定，选择最适合短片节奏的结尾。']]}
      ];
      const initial = () => ({stage:'home',scene:'通用',prompt:defaultPrompt,answers:['','',''],extras:['','',''],question:0,version:1,planOpen:false,quoteAgreed:false,textApproved:false,canvasCreated:false,mobileCanvas:false,phase:0,selectedNode:'',nodeNames:{},messages:[],editNote:'',retry:false,restored:false,zoom:0.8});
      let s = initial(); let timer = null; let toastTimer = null; let previousFocus = null;
      const esc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const btn = (text,action,cls='secondary',extra='') => `<button class="${cls}" data-action="${action}" ${extra}>${text}</button>`;
      const referenceNames = ['角色参考 · 年轻侦探','场景参考 · 雨夜办公室','道具参考 · 神秘信件'];
      const nodeName = id => s.nodeNames[id] || (id==='script'?'故事与视频方案':id.startsWith('video')?'雨夜来信 · 15 秒短片':referenceNames[Number(id.split('-')[1])-1]);
      const art = (index=1,video=false) => `<div class="scene-art scene-${index}" role="img" aria-label="${video?'15 秒短片':referenceNames[index-1]}的抽象示意，并非真实生成素材"><i class="head"></i><i class="clock-face"></i><i class="art-grain"></i><span class="art-label">${video?'短片封面':'参考图片'}示意</span>${video?'<span class="play" aria-hidden="true">▶</span>':''}</div>`;
      const toast = message => { clearTimeout(toastTimer); const el=document.getElementById('toast'); el.textContent=message; el.hidden=false; toastTimer=setTimeout(()=>el.hidden=true,2800); };
      const stopTimer = () => {if(timer)clearInterval(timer);timer=null;};
      function progress() {
        if(s.stage==='questions')return {done:0,active:0,label:'完善创作需求'};
        if(s.stage==='proposal')return {done:1,active:1,label:'等待确认创意方案'};
        if(s.stage==='quote')return {done:s.retry?4:3,active:s.retry?4:3,label:s.retry?'等待视频重做授权':'等待确认生成费用'};
        if(s.stage==='running')return {done:s.phase<2?3:s.phase<4?4:5,active:s.phase<2?3:s.phase<4?4:5,label:s.retry?'正在重做 15 秒短片':s.phase<2?'正在生成 3 张参考图片':s.phase<4?'正在生成 1 段 15 秒短片':'正在回写结果'};
        if(s.stage==='failure')return {done:5,active:5,label:'产物已就绪 · 等待恢复回写'};
        if(s.stage==='complete')return {done:6,active:-1,label:'创作已完成'};
        return {done:0,active:-1,label:''};
      }
      function shell() {
        const onCanvas=s.canvasCreated;
        return `<aside class="app-sidebar"><div class="brand"><span class="brand-mark">∞</span><span class="brand-word">影绘<small>创作工作台</small></span></div>
          <button class="side-action ${!onCanvas?'active':''}" data-action="home"><span class="side-glyph">⌂</span><span class="nav-text">创作首页</span></button>
          <button class="side-action" data-action="short-drama"><span class="side-glyph">▤</span><span class="nav-text">短剧工作台</span></button>
          <button class="side-action ${onCanvas?'active':''}" data-action="canvas"><span class="side-glyph">▦</span><span class="nav-text">画布</span></button>
          <button class="side-action" data-action="assets"><span class="side-glyph">▧</span><span class="nav-text">素材库</span></button>
          <div class="side-group">最近创作</div><button class="side-action" data-action="resume"><span class="side-glyph">◷</span><span class="nav-text">雨夜来信</span></button>
          <div class="side-foot"><span class="avatar">YC</span><span class="account-text">我的工作空间<small>个人创作</small></span></div></aside>
          <main class="app-stage"><header class="app-topbar"><div class="breadcrumb"><span class="optional">影绘</span><span class="optional">/</span><strong>${onCanvas?'雨夜来信':s.stage==='home'?'创作首页':'新创作'}</strong>${s.stage!=='home'?'<span class="soft-pill">悬疑短片</span>':''}</div><div class="top-actions">${onCanvas?'<span class="top-status">同一会话 · 5 个节点</span>':s.stage!=='home'?'<span class="top-status">画布节点 0</span>':''}${onCanvas?btn(s.mobileCanvas?'返回会话':'查看画布','mobile-canvas','mini-btn mobile-toggle'):''}${btn('新创作','new','mini-btn')}</div></header><div class="content">${s.stage==='home'?home():onCanvas?canvas():`<section class="conversation-only">${chat()}</section>`}</div></main>`;
      }
      function home() {
        return `<section class="home-page"><div class="home-inner"><div class="eyebrow">从一个想法，到一份作品</div><h1>今天，想创作点什么？</h1><p class="home-subtitle">告诉我你的想法，我们一起把它变成画面。</p>
          <div class="scene-switch" aria-label="创作场景">${['通用','短剧','营销','电商'].map(x=>`<button data-action="scene" data-scene="${x}" aria-pressed="${s.scene===x}">${x}</button>`).join('')}</div>
          <form id="home-form" class="home-composer"><label for="home-prompt" class="sr-only">描述你的创作需求</label><textarea id="home-prompt" placeholder="描述你想创作的内容，也可以添加参考素材…">${esc(s.prompt)}</textarea><div class="composer-tools"><div class="composer-tool-left">${btn('＋ 素材','attach','mini-btn')}<span class="soft-pill">Agent 自动</span><span class="soft-pill">技能 · 短片创作</span></div><button type="submit" class="primary">开始创作 ↑</button></div></form>
          <div class="home-examples"><button class="example" data-action="example" data-example="short"><span>短剧 / 影视</span><strong>15 秒，讲一个悬疑故事</strong><p>从创意、参考素材到完整短片</p></button><button class="example" data-action="example" data-example="marketing"><span>营销创作</span><strong>把一个卖点讲得更动人</strong><p>从受众、文案到视觉方案</p></button><button class="example" data-action="example" data-example="commerce"><span>电商设计</span><strong>让商品成为画面的主角</strong><p>从商品素材到场景图组</p></button></div><p class="home-note">本次完整演示：悬疑短片。营销、电商入口展示后续复用位置。</p></div></section>`;
      }
      function userMessage(text) {return `<div class="message user"><div class="user-bubble">${esc(text)}</div></div>`;}
      function assistant(body) {return `<div class="message assistant"><div class="assistant-label"><span class="assistant-dot">∞</span>影绘</div>${body}</div>`;}
      function questionCard() {
        const q=questions[s.question];
        return `<div class="question-card"><div class="card-overline"><span>补充创作需求 · ${s.question+1} / ${questions.length}</span><span class="step-dots">${questions.map((_,i)=>`<i class="${i<=s.question?'current':''}"></i>`).join('')}</span></div><h3 class="question-title">${q.title}</h3><p class="question-help">${q.hint}</p><div class="options">${q.options.map(([title,desc])=>`<button class="option" data-action="answer" data-value="${esc(title)}" aria-pressed="${s.answers[s.question]===title}"><i class="option-radio"></i><span><strong>${title}</strong><small>${desc}</small></span></button>`).join('')}</div><label class="free-label" for="answer-extra">自定义或补充要求</label><textarea class="field" id="answer-extra" rows="2" placeholder="也可以直接写你的想法…">${esc(s.extras[s.question])}</textarea><div id="question-error" class="error-text" aria-live="polite"></div><div class="card-footer"><div class="left">${btn('上一题','prev-question','mini-btn',s.question===0?'disabled':'')}</div><div class="right">${btn(s.question===2?'提交需求':'下一题 →',s.question===2?'submit-answers':'next-question','primary')}</div></div></div>`;
      }
      function submitted() {return `<div class="submitted"><div><span>✓ 已提交</span> · ${esc(s.answers[0]||'自定义悬念')} / ${esc(s.answers[1]||'自定义风格')}</div>${btn('查看 / 修改','edit-answers','text-button')}</div>`;}
      function titleText(){ return s.answers[0]==='身份谜局'?'另一位侦探':s.answers[0]==='无声追踪'?'门外的脚步':'雨夜来信'; }
      function story(){ return s.answers[0]==='身份谜局'?'雨夜，侦探收到一封署着自己名字的信。信中照片上的人正坐在同一张书桌前。门开了，对方称这里是自己的办公室。':s.answers[0]==='无声追踪'?'雨夜，侦探收到一封写着自己名字的信。拆信时，门外的脚步与他的心跳同步。信纸上只有一句：不要让门外的人知道你在这里。':'雨夜，年轻侦探收到一封写着自己名字的信。信里警告：不要开门。敲门声响起，他透过门缝看见的，却是另一个自己。'; }
      function proposalCard(compact=false) {
        return `<div class="plan-card"><div class="card-overline"><span>创意方案 · v${s.version}</span><span>${s.canvasCreated?'已确认版本可回看':'等待你的确认'}</span></div><h3>《${titleText()}》</h3><p class="logline">${story()}</p>${compact?'':`<div class="plan-summary"><div><strong>1 集 · 15 秒 · 9:16</strong><span>一段视频，分为 3 个叙事节奏</span></div><div><strong>${esc(s.answers[1]||'写实电影感')}</strong><span>冷色雨夜 / 克制表演</span></div><div><strong>角色、场景与道具</strong><span>年轻侦探 / 旧办公室 / 神秘信件</span></div><div><strong>预期产物</strong><span>3 张参考图 + 1 段 15 秒短片</span></div></div>`}${s.editNote?`<p class="quiet">本版调整：${esc(s.editNote)}</p>`:''}<div class="scope-note">${s.canvasCreated?'这是已确认的创意方向。修改后会生成新版本，再确认受影响的节点。':'确认后创建 1 个方案文本节点、3 个参考图片节点、1 个视频节点及连线。图片和视频生成费用另行确认。'}</div><div class="card-footer"><div class="left">${btn('查看完整方案','view-plan','text-button')}</div><div class="right">${!s.canvasCreated?btn('修改','edit-plan','secondary')+btn('确认方案','confirm-plan','primary'):''}</div></div></div>`;
      }
      function quote() {

        if(a==='example'){if(button.dataset.example==='short'){s.prompt=defaultPrompt;s.scene='短剧';render();document.getElementById('home-prompt').focus();}else toast('本次聚焦短片完整链路；该场景沿用同一输入和问答框架。');return;}
        if(a==='short-drama'){toast('产品中沿用已有短剧工作台；本原型聚焦首页创作链路。');return;}
        if(a==='assets'||a==='attach'){showDialog('添加参考素材',`<p>产品中复用现有素材库与上传选择器。此评审原型不上传文件。</p><div class="scope-note">素材会进入同一会话上下文。模型已经知道的角色、场景、比例和类型，应优先从素材与用户描述中提取。</div>`,`<span class="quiet">本例暂无附件</span><div>${btn('返回创作','close-dialog','primary')}</div>`);return;}
        if(a==='canvas'){if(!s.canvasCreated)toast('方案尚未确认，画布保持 0 个节点。');else{s.mobileCanvas=true;render({fit:true});}return;}
        if(a==='resume'){if(s.stage==='home')seed('questions');else toast('当前就是这段创作会话。');return;}
        if(a==='answer'){answerSave();s.answers[s.question]=button.dataset.value;render();return;}
        if(a==='prev-question'){answerSave();s.question=Math.max(0,s.question-1);render();return;}
        if(a==='next-question'){if(answerValid()){s.question=Math.min(2,s.question+1);render({bottom:true});}return;}
        if(a==='submit-answers'){if(answerValid()){s.stage='proposal';s.question=0;render({bottom:true});}return;}
        if(a==='edit-answers'){if(s.canvasCreated){showDialog('已提交的创作需求',questions.map((q,i)=>`<h3>${q.title}</h3><p>${esc(s.answers[i]||'自定义')} ${esc(s.extras[i])}</p>`),`<span class="quiet">调整后生成新方案版本</span><div>${btn('修改方案','edit-plan','primary')}</div>`);}else{s.stage='questions';s.question=0;s.version+=1;render({bottom:true});}return;}
        if(a==='view-plan'){planDetail();return;}
        if(a==='edit-plan'){editPlan();return;}
        if(a==='save-plan'){const note=document.getElementById('plan-edit').value.trim();if(!note){toast('请填写调整要求。');return;}s.editNote=note;s.version+=1;closeDialog();if(s.canvasCreated){s.messages.push({role:'assistant',text:`已记录方案 v${s.version} 的调整。现有节点暂不改变；原型本期以首次方案确认及节点局部编辑为主要评审路径。`});}else s.stage='proposal';render({bottom:true});return;}
        if(a==='confirm-plan'){if(dialog.open)closeDialog();s.canvasCreated=true;s.stage='quote';s.planOpen=false;s.quoteAgreed=false;render({bottom:true,fit:true});return;}
        if(a==='approve-text'){s.textApproved=true;s.stage='questions';closeDialog();render({bottom:true});return;}
        if(a==='approve'){if(s.quoteAgreed)startRun();return;}
        if(a==='toggle-plan'){s.planOpen=!s.planOpen;render();return;}
        if(a==='pause'){stopTimer();toast('演示已暂停，可在顶部选择状态继续评审。');return;}
        if(a==='restore'){s.restored=true;s.stage='complete';s.planOpen=false;render({bottom:true});toast('已仅恢复结果回写，新增生成费用为 0。');return;}
        if(a==='redo'){s.retry=true;s.restored=false;s.stage='quote';s.quoteAgreed=false;s.selectedNode='video-1';render({bottom:true});return;}
        if(a==='edit-node-prompt'){document.getElementById('chat-input').value='把场景参考节点改名为“场景参考 · 雨夜旧办公室”';document.getElementById('chat-input').focus();return;}
        if(a==='rename'){const id=button.dataset.id;showDialog('修改节点名称',`<label class="free-label" for="node-name">节点名称</label><input id="node-name" class="field" value="${esc(nodeName(id))}"><p class="quiet">仅修改画布节点名称，不触发生成。</p>`,`<span></span><div>${btn('保存名称','save-name','primary',`data-id="${id}"`)}</div>`);return;}
        if(a==='save-name'){const name=document.getElementById('node-name').value.trim();if(!name){toast('节点名称不能为空。');return;}s.nodeNames[button.dataset.id]=name;s.selectedNode=button.dataset.id;closeDialog();render();toast('节点名称已更新。');return;}
        if(a==='node-detail'){const id=button.dataset.id;const video=id.startsWith('video');showDialog('节点参数',`<div class="detail-meta"><span>${video?'视频节点':'图片节点'}</span><span>9:16</span><span>${video?'15 秒 · 1 段完整短片':'单张参考图'}</span></div><h3>提示词</h3><p>${video?`${story()} 一段 15 秒视频依次表现信件出现、信中警告、门外身影三个叙事节奏，使用已确认的角色、场景、道具参考。`:id.endsWith('1')?'年轻侦探，约 28 岁，短发、深色风衣、克制神情。写实电影质感，清晰体现人物外观，用作全片人物参考。':id.endsWith('2')?'雨夜旧办公室，窄窗、木桌、走廊门。冷色窗光与桌面暖灯对比，用作全片场景参考。':'米白信封、黑色手写字迹及展开的信纸。道具细节清晰，用作视频中神秘信件的外观参考。'}</p><h3>参考关系</h3><p>${video?'本例选择已验证支持 15 秒及三类参考输入的视频模型。三个参考节点成功后才提交一次视频任务。实际接入时按模型能力校验数量与输入角色。':'引用已确认的创意方案中对应设定，生成后供同一个视频节点使用。'}</p><div class="scope-note">参数调整与重新生成分开。产生新生成费用时，需要新的批次授权。</div>`,`<span class="quiet">当前展示既有语义节点</span><div>${btn('关闭','close-dialog','primary')}</div>`);return;}
        if(a==='preview'){const shot=Number(button.dataset.shot||1),video=button.dataset.kind==='video';showDialog(video?`《${titleText()}》· 15 秒短片示意`:`${referenceNames[shot-1]} · 图片示意`,`<div class="large-art">${art(shot,video)}</div><p style="text-align:center">${video?'示例封面 · 没有真实视频文件，播放按钮表示产品中的完整短片预览入口。':'抽象参考图片示意，不是模型真实生成素材。'}</p>`,`<span class="quiet">${video?'15 秒 · 1 段视频':'1 张参考图'} · 9:16</span><div>${btn('返回','close-dialog','primary')}</div>`);return;}
        if(a==='zoom-in'||a==='zoom-out'){s.zoom=Math.min(1.5,Math.max(.35,s.zoom+(a==='zoom-in'?.1:-.1)));resizeCanvas();return;}
        if(a==='fit'){resizeCanvas(true);return;}
        if(a==='arrange'){s.selectedNode='';resizeCanvas(true);toast('已按“方案 → 角色 / 场景 / 道具参考 → 15 秒短片”整理并适应画布。');return;}
        if(a==='mobile-canvas'){s.mobileCanvas=!s.mobileCanvas;render({fit:true});return;}
        if(a==='close-dialog'){closeDialog();return;}
      });
      document.addEventListener('submit',event=>{if(event.target.id==='home-form'){event.preventDefault();const input=document.getElementById('home-prompt').value.trim();if(!input){toast('先写下你的创作想法。');return;}s.prompt=input;if(!/15|悬疑|侦探|雨夜/.test(input)){toast('本原型完整演示悬疑短片，请使用下方短片示例。');return;}s.canvasCreated=false;if(!s.textApproved){showDialog('确认本次创作规划预算',`<p>理解需求、补充问答和生成创意方案也可能产生文本模型费用。</p><div class="receipt-card"><div class="receipt-line"><span>授权范围</span><strong>本次短片需求梳理与方案生成</strong></div><div class="receipt-line"><span>文本请求上限</span><strong>6 次示例请求</strong></div><div class="receipt-line"><span>总费用上限</span><strong>2 示例积分</strong></div></div><p>范围内继续补问与规划，达到请求次数或费用上限后再次确认。图片和视频任务稍后单独报价。</p><div class="scope-note">这里的模型次数和积分仅用于设计评审，不是真实价格；点击确认不会请求模型或扣费。</div>`,`<span class="quiet">示例预算 · 本次会话有效</span><div>${btn('取消','close-dialog','secondary')}${btn('确认，开始梳理需求','approve-text','primary')}</div>`);}else{s.stage='questions';render({bottom:true});}}if(event.target.id==='chat-form'){event.preventDefault();sendChat(document.getElementById('chat-input').value);}});
      document.addEventListener('change',event=>{if(event.target.id==='review-state')seed(event.target.value);if(event.target.id==='quote-agree'){s.quoteAgreed=event.target.checked;const approve=root.querySelector('[data-action="approve"]');if(approve)approve.disabled=!s.quoteAgreed;}});
      dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeDialog();}});
      window.addEventListener('resize',()=>resizeCanvas(true));
      document.documentElement.dataset.theme=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
      render();
    })();
  </script>
</body>
</html>
