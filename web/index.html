<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="AI 影视与短剧创作工作台" />
        <!-- 不写内置品牌资源：首屏必须品牌中性，favicon 由 use-appearance-store 解析出外观后写入。
             空 data URL 只是为了不让浏览器去请求 /favicon.ico（那会是一条 404）。 -->
        <link rel="icon" href="data:," />
        <title>正在加载</title>
        <style>
            /* Fix layer order before production chunks can register utilities ahead of base. */
            @layer theme, base, components, utilities;

            html,
            body {
                margin: 0;
                background: #ffffff;
            }
            /* 与 globals.css 的 .dark --background 一致；暗色主题下切页或首屏不透出白底。 */
            html.dark,
            html.dark body {
                background: #0f0f11;
            }
            #root:empty {
                min-height: 100vh;
            }
            /* 启动信号是 FullScreenLoader 里 .loading-signal 的镜像：同尺寸、同位置、同节奏，
               并按同一 performance.now() 时钟对齐相位（见 body 内脚本），React 接管时扫光原地继续。
               只用中性墨色，首屏保持品牌中性；改动时与 globals.css 的 .loading-signal 一起改。 */
            #root:empty::before {
                --boot-signal-ink: rgba(23, 23, 23, 0.8);
                content: "";
                position: fixed;
                left: 50%;
                top: 50%;
                width: 112px;
                height: 2px;
                margin: -1px 0 0 -56px;
                border-radius: 999px;
                background:
                    linear-gradient(90deg, transparent, var(--boot-signal-ink) 25%, var(--boot-signal-ink) 75%, transparent) -66.667% 0 / 40% 100% no-repeat,
                    rgba(16, 16, 20, 0.1);
                animation: boot-signal-sweep 1500ms cubic-bezier(0.35, 0.05, 0.65, 0.95) calc(-1 * var(--boot-signal-clock, 0ms)) infinite;
            }
            html.dark #root:empty::before {
                --boot-signal-ink: rgba(245, 245, 245, 0.8);
                background-color: rgba(244, 244, 246, 0.1);
            }
            @keyframes boot-signal-sweep {
                from {
                    background-position: -66.667% 0;
                }
                to {
                    background-position: 166.667% 0;
                }
            }
            @keyframes boot-signal-breathe {
                0%,
                100% {
                    opacity: 0.35;
                }
                50% {
                    opacity: 1;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #root:empty::before {
                    background-position: 50% 0;
                    animation-name: boot-signal-breathe;
                    animation-timing-function: ease-in-out;
                }
            }
        </style>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("yingce:theme_store") || "{}");
                var t = s.state && s.state.theme === "dark" ? "dark" : "light";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script>
            // 放在 #root 之后：外链样式加载完、首帧绘制前才执行，启动信号从这一刻对齐 performance.now()。
            document.getElementById("root").style.setProperty("--boot-signal-clock", performance.now() + "ms");
        </script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
