<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="影策，让一个故事从文字走向银幕。面向 AI 影视与短剧创作的开源工作台。" />
        <link rel="icon" href="/logo.svg" />
        <title>影策</title>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("infinite-canvas:theme_store") || "{}");
                var t = s.state && s.state.theme === "light" ? "light" : "dark";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
            try {
                // 与 use-locale-store 同一 key：已选语言直接用，未选按环境猜一次（与 detectLocale 同规则）
                var ls = JSON.parse(localStorage.getItem("infinite-canvas:locale_store") || "{}");
                var loc = ls.state && ls.state.locale;
                if (loc !== "zh-CN" && loc !== "en") {
                    var nav = (navigator.language || "").toLowerCase();
                    loc = nav.indexOf("zh") === 0 ? "zh-CN" : nav.indexOf("en") === 0 ? "en" : "zh-CN";
                }
                document.documentElement.lang = loc;
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
