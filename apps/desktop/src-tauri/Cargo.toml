[package]
name = "yingce-desktop"
# 与仓库根 VERSION 保持一致，build.rs 会在漂移时直接失败。
version = "1.6.0"
edition = "2021"
rust-version = "1.82"
description = "影策桌面壳：Tauri 2 host 托管本地 Go 服务，窗口加载本地服务地址"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon 提供托盘菜单；image-png 用于从 PNG 解码托盘/窗口图标。
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
